name: Deploy to Server (stillgelegt)

# Stillgelegt 2026-11-03: tixomat.de wird abgeschaltet. Ein Push auf main
# deployt nicht mehr. Die Kunden-Seiten laufen weiter über deploy-site.yml.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Plugin
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='bot/' --exclude='mu-plugins/' --exclude='DP-CONNECT-BOT/' --exclude='.claude/' --exclude='tests/'
          path: ./
          remote_path: /home/runcloud/webapps/Tixomat/wp-content/plugins/tixomat-plugin/
          remote_host: 51.195.61.6
          remote_port: 22
          remote_user: runcloud
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy mu-Plugins
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: ./mu-plugins/
          remote_path: /home/runcloud/webapps/Tixomat/wp-content/mu-plugins/
          remote_host: 51.195.61.6
          remote_port: 22
          remote_user: runcloud
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
