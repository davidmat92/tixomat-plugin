name: Deploy to site (manual)

# Manueller Deploy auf die Kunden-Sites über GitHub Actions – ohne SSH vom eigenen Rechner.
#
#   site=alle         → zuerst kitchenklub.de (Prüfung), danach PARALLEL: evendis.de, mallorca-festival-xxl.de und je
#                       Kunden-Server EIN Lauf für alle seine Kunden (Phase 0 „paralleler Rollout“, 12.11.2026)
#   site=evendis      → nur evendis.de (Testdaten – vor „alle“ dort zuerst prüfen)
#   site=test-quelle  → nur demo.mdj.events (Test-Quelle für geteilte Events), NICHT Teil von „alle“
#   site=<einzeln>    → nur diese Site
#   site=xxl          → XXL Schlagerparty auf dem Sammelserver kunden-hetzner
#   site=kunde        → ein Kunde nach Kurzname (Eingabe „kunde“), Server: Eingabe „host“, sonst KUNDEN_HOST
#
# Kunden-Server (KUNDEN_HOST + KUNDEN_HOSTS): EIN rsync in /home/runcloud/tixomat-plugin/eingang, dann verteilt
# `sudo kunden-plugin verteilen <version> [--nur <kurz>]` (ops/kunden-hetzner im Monorepo) an alle aktiven Kunden des
# Servers (als Kundennutzer), leert den OPcache aller Pools mit EINEM php-fpm-reload und prüft jede Seite (/info + Startseite).
# Rückweg auf dem Server: `sudo kunden-plugin zurueck <alte Version>` (Lager /opt/tixomat-plugin, letzte 6 Versionen).
# Verschiedene Server laufen gleichzeitig; KitchenKlub zuerst, bei Fehler dort läuft nichts weiter.

run-name: "Deploy ${{ inputs.site }}${{ inputs.kunde && format(' {0}', inputs.kunde) || '' }}${{ inputs.kennung && format(' [{0}]', inputs.kennung) || '' }}"
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Ziel-Site (alle = kitchenklub + evendis + mallorca + Kunden auf kunden-hetzner)"
        required: true
        default: evendis
        type: choice
        options: [alle, evendis, test-quelle, kitchenklub, mallorca, xxl, kunde]
      kunde:
        description: "Nur bei site=kunde: Kurzname des Kunden auf kunden-hetzner (a-z0-9)"
        required: false
        default: ""
        type: string
      kennung:
        description: "Korrelations-ID des Kunden-Dienstes (lib/gh.py), erscheint im Lauf-Namen"
        required: false
        default: ""
        type: string
      host:
        description: "Nur bei site=kunde: IPv4 des Kunden-Servers (eigener Server). Leer = KUNDEN_HOST. Muss in KUNDEN_HOSTS stehen."
        required: false
        default: ""
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      erste: ${{ steps.list.outputs.erste }}
      ziele: ${{ steps.list.outputs.ziele }}
    steps:
      - id: list
        env:
          SITE: ${{ inputs.site }}
          KUNDE: ${{ inputs.kunde }}
          HOST_IN: ${{ inputs.host }}
          KUNDEN_HOST: ${{ vars.KUNDEN_HOST }}
          KUNDEN_HOSTS: ${{ vars.KUNDEN_HOSTS }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Alle Kunden-Server: Sammelserver KUNDEN_HOST + eigene Server aus KUNDEN_HOSTS (IPv4, Komma/Leerzeichen getrennt)
          HOSTS=$(printf '%s %s' "$KUNDEN_HOST" "$KUNDEN_HOSTS" | tr ',' ' ' | tr -s ' ' '\n' | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' | sort -u | tr '\n' ' ' || true)
          HOSTS="${HOSTS% }"
          erlaubt() { local x; for x in $HOSTS; do [ "$x" = "$1" ] && return 0; done; return 1; }
          # Ein Ziel je Kunden-Server (kunden-plugin verteilt dort an alle Kunden). Erreichbarkeit prüft der Lauf je Server.
          server() { local h; for h in $HOSTS; do echo "server:$h"; done; }
          erste=""
          case "$SITE" in
            alle)  erste="kitchenklub"; list="evendis mallorca $(server | tr '\n' ' ')" ;;
            xxl)   [[ "$KUNDEN_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::KUNDEN_HOST fehlt"; exit 1; }
                   list="server:$KUNDEN_HOST:xxl" ;;
            kunde) [[ "$KUNDE" =~ ^[a-z][a-z0-9]{1,15}$ ]] || { echo "::error::Eingabe kunde fehlt oder ungültig"; exit 1; }
                   h="${HOST_IN:-$KUNDEN_HOST}"
                   [[ "$h" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::Host fehlt oder ungültig (KUNDEN_HOST bzw. Eingabe host)"; exit 1; }
                   erlaubt "$h" || { echo "::error::Host $h steht nicht in KUNDEN_HOST/KUNDEN_HOSTS (gh variable set KUNDEN_HOSTS -b \"<ip>,<ip>\")"; exit 1; }
                   list="server:$h:$KUNDE" ;;
            *)     list="$SITE" ;;
          esac
          echo "erste=$(printf '%s\n' $erste | jq -R . | jq -cs 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "ziele=$(printf '%s\n' $list | jq -R . | jq -cs 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "Zuerst: ${erste:-–} · danach parallel: $list"
  # Welle 1: KitchenKlub allein (Rollout-Reihenfolge seit 2026-10-11 – display_errors dort ist an)
  erste:
    needs: plan
    if: needs.plan.outputs.erste != '[]'
    strategy:
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.erste) }}
    uses: ./.github/workflows/deploy-ziel.yml
    with:
      site: ${{ matrix.site }}
    secrets: inherit

  # Welle 2: alle übrigen Ziele gleichzeitig – jedes Ziel ist ein anderer Server
  deploy:
    needs: [plan, erste]
    if: always() && needs.plan.result == 'success' && needs.erste.result != 'failure' && needs.erste.result != 'cancelled' && needs.plan.outputs.ziele != '[]'
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.ziele) }}
    uses: ./.github/workflows/deploy-ziel.yml
    with:
      site: ${{ matrix.site }}
    secrets: inherit
